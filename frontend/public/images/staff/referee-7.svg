  <path d="M86 126 L100 147 L114 126 Z" fill="#f5f3ff"/>
  <path d="M78 122 L100 150 L89 150 L70 127 Z" fill="#ffffff"/>
  <path d="M122 122 L100 150 L111 150 L130 127 Z" fill="#ffffff"/>
