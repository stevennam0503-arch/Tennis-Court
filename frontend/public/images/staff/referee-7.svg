  <path d="M92 98 Q100 106 108 98" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Gold Badge -->
  <rect x="124" y="154" width="22" height="13" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
  <text x="135" y="163" font-size="7" font-weight="900" font-family="sans-serif" fill="#713f12" text-anchor="middle">REFEREE</text>
</svg>
