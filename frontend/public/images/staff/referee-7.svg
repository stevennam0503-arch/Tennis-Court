  <rect x="89" y="106" width="22" height="24" rx="4" fill="url(#skin7)"/>
  <!-- Head -->
  <ellipse cx="100" cy="85" rx="27" ry="32" fill="url(#skin7)"/>
  <!-- Ears & Pearl Earring -->
  <ellipse cx="72" cy="86" rx="4" ry="7" fill="#fba86c"/>
  <circle cx="72" cy="91" r="2" fill="#ffffff"/>
  <ellipse cx="128" cy="86" rx="4" ry="7" fill="#fba86c"/>
  <circle cx="128" cy="91" r="2" fill="#ffffff"/>
  <!-- Hair & Visor -->
  <path d="M73 75 C73 50 82 45 100 45 C118 45 127 50 127 75 Z" fill="#312e81"/>
  <path d="M62 72 Q100 62 138 72 Q100 78 62 72 Z" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="83" rx="3.5" ry="4" fill="#0f172a"/>
  <ellipse cx="112" cy="83" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="89" cy="81.5" r="1.2" fill="#ffffff"/>
  <circle cx="113" cy="81.5" r="1.2" fill="#ffffff"/>
  <!-- Eyebrows & Lashes -->
  <path d="M83 77 Q89 74 94 77" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M106 77 Q111 74 117 77" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
