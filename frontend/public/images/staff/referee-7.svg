      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="skin7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba86c"/>
    </linearGradient>
    <linearGradient id="polo7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg7)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Ponytail in background -->
  <path d="M125 75 Q155 85 145 125 Q135 120 128 85 Z" fill="#312e81"/>
  <!-- Body / Shoulders -->
  <path d="M38 200 C38 152 68 142 100 142 C132 142 162 152 162 200 Z" fill="url(#polo7)"/>
