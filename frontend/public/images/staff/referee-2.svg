  <rect x="52" y="155" width="22" height="13" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="63" y="164" font-size="7" font-weight="800" font-family="sans-serif" fill="#047857" text-anchor="middle">OFFICIAL</text>
</svg>
