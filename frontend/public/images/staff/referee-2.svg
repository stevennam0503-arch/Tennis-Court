      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="polo2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg2)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Body / Shoulders -->
  <path d="M35 200 C35 150 65 140 100 140 C135 140 165 150 165 200 Z" fill="url(#polo2)"/>
  <!-- Dark green trim on collar -->
  <path d="M85 125 L100 148 L115 125 Z" fill="#ffffff"/>
  <path d="M78 120 L100 152 L88 152 L68 126 Z" fill="#064e3b"/>
