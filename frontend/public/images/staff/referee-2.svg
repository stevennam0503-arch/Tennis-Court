  <path d="M60 76 Q100 66 140 76 Q100 84 60 76 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="100" cy="62" r="5" fill="#f97316"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="86" rx="3.5" ry="4" fill="#0f172a"/>
  <ellipse cx="112" cy="86" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="89" cy="84.5" r="1" fill="#ffffff"/>
  <circle cx="113" cy="84.5" r="1" fill="#ffffff"/>
  <!-- Eyebrows -->
  <path d="M82 79 Q88 77 94 80" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M106 80 Q112 77 118 79" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Nose & Smile -->
  <path d="M100 86 L98 94 L103 94" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M92 103 Q100 110 108 103" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>
