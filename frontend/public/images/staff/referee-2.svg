  <circle cx="100" cy="175" r="5" fill="#e2e8f0"/>
  <!-- Neck -->
  <rect x="88" y="105" width="24" height="25" rx="4" fill="#f97316" opacity="0.5"/>
  <rect x="88" y="105" width="24" height="25" rx="4" fill="#fdba74"/>
  <!-- Head -->
  <ellipse cx="100" cy="88" rx="29" ry="34" fill="url(#skin2)"/>
  <!-- Ears -->
  <ellipse cx="70" cy="88" rx="5" ry="8" fill="#ea580c"/>
  <ellipse cx="130" cy="88" rx="5" ry="8" fill="#ea580c"/>
  <!-- Tennis Cap -->
  <path d="M71 78 C71 52 82 46 100 46 C118 46 129 52 129 78 Z" fill="#ffffff"/>
